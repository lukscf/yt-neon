name: Jev

# Checagens com o Jev (TypeSafe): juízos baratos sobre o PR (texto, diff, telas), decididos em
# código em .jev/checks.mjs. Workflow separado de propósito: não entra no portão do ci-green, e
# sem TYPESAFE_API_KEY as checagens que dependem do Jev só são puladas, com aviso.
# Sem action de artefato: o runner do celular não consegue baixá-la. O relatório fica no resumo
# do job e, no runner, em ~/.cache/jev-kit/reports/<repo>/.
# Kit: lukscf/tank4, ops/jev-kit/GUIA.md.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jev-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  jev:
    name: Jev
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Checagens com Jev
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: node .jev/jev.mjs run
